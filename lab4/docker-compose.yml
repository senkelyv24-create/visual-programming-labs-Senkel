# Запуск по условию лабораторной. Из папки lab4: docker compose up -d
# Редактор: http://localhost:5678
# Redis с хоста: localhost:6379
# Из контейнера n8n к Redis: host.docker.internal:6379
services:
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.114.4
    container_name: n8n-senkel
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Minsk
      - TZ=Europe/Minsk
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
